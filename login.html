<!DOCTYPE html>
<html>
<head>
    <title>PANENKA Coffee Login</title>

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Your CSS -->
    <link rel="stylesheet" href="loginstyle.css">
</head>

<body>

<div class="auth-card">

<h1>PANENKA Coffee ☕</h1>
<h2>Log Into Your Account</h2>

<form action="/login" method="post">

<label>Email</label>
<input type="email" name="email" placeholder="Write your email" required>

<label>Password</label>
<input type="password" name="password" placeholder="Password" required>

<input type="submit" value="Login" class="auth-btn">

</form>

<div class="auth-link">
<a href="createaccount.html">Create an account</a>
</div>

</div>

</body>
</html>
