<!DOCTYPE html>
<html>
<head>
    <title>PANENKA Coffee — Create Account</title>

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

    <!-- Same CSS as login -->
    <link rel="stylesheet" href="loginstyle.css">
</head>

<body>

<div class="auth-card">

<h1>PANENKA Coffee ☕</h1>
<h2>Create a New Account</h2>

<form action="/signup" method="post">

<label>SN</label>
<input type="text" name="sn" required>

<label>First Name</label>
<input type="text" name="fname" required>

<label>Last Name</label>
<input type="text" name="lname" required>

<label>Birthday</label>
<input type="date" name="birthday">

<label>Gender</label>

<div class="gender-group">
  <label><input type="radio" name="gender" value="Female"> Female</label>
  <label><input type="radio" name="gender" value="Male"> Male</label>
  <label><input type="radio" name="gender" value="Custom"> Custom</label>
</div>

<label>Phone Number</label>
<input type="tel" name="phone">

<label>Country</label>
<input type="text" name="country" placeholder="Nepal">

<label>Email</label>
<input type="email" name="email" required>

<label>Password</label>
<input type="password" name="password" required>

<input type="submit" value="Create Account" class="auth-btn">

</form>

<div class="auth-link">
<a href="login.html">Already have an account</a>
</div>

</div>

</body>
</html>
